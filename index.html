<!DOCTYPE html>
<html lang="pt-BR">

<meta name="theme-color" content="#1f3f8f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>JISUDESC 2026 · Jogos do CCT</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1a2233;--mut:#6b7488;--pri:#1f3f8f;--acc:#f5b400;--cct:#e8efff;--line:#e3e7f0}
@media (prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#192030;--ink:#e8ecf5;--mut:#98a2b8;--pri:#7fa2ff;--cct:#23305a;--line:#2a3348}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:var(--pri);color:#fff;padding:16px 16px 12px}
@media (prefers-color-scheme:dark){header{background:#1f3f8f}}
header h1{margin:0;font-size:20px}
header p{margin:4px 0 0;font-size:13px;opacity:.85}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 6px;border-bottom:1px solid var(--line)}
.seg{display:flex;gap:6px;overflow-x:auto}
.seg button{flex:1 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 12px;font-size:14px;font-weight:600}
.seg button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.tog{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.tog label{display:flex;align-items:center;gap:6px;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 10px}
.wrap{padding:12px}
details.sp{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px}
details.sp summary{padding:12px 14px;font-weight:600;font-size:15px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px}
.chip{display:flex;align-items:center;border:1px solid var(--line);border-radius:18px;background:var(--bg);font-size:13px;overflow:hidden}
.chip .n{padding:7px 4px 7px 10px;background:none;border:0;color:var(--ink);font-size:13px}
.chip.sel{border-color:var(--pri);background:var(--cct)}
.chip.sel .n{font-weight:700}
.chip .st{border:0;background:none;padding:7px 9px 7px 4px;font-size:15px;color:var(--mut)}
.chip .st.f{color:var(--acc)}
.mini{display:flex;gap:8px;padding:0 12px 12px}
.mini button{font-size:12px;border:1px solid var(--line);background:none;color:var(--pri);border-radius:14px;padding:5px 10px}
h2.day{font-size:16px;margin:18px 4px 8px;color:var(--pri)}
.g{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;display:flex;gap:12px}
.g.past{opacity:.5}
.g.next{border:2px solid var(--acc)}
.g.cond{border-style:dashed}
.tm{min-width:58px;text-align:center}
.tm b{display:block;font-size:19px}
.tm small{font-size:11px;color:var(--mut)}
.bd{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.sport{font-weight:700;font-size:14px}
.fstar{border:0;background:none;font-size:20px;line-height:1;color:var(--mut);padding:0 2px}
.fstar.f{color:var(--acc)}
.vs{margin:6px 0;font-size:15px}
.vs .c{background:var(--cct);color:var(--pri);font-weight:800;padding:1px 6px;border-radius:6px}
.meta{font-size:12px;color:var(--mut);line-height:1.5}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;margin:4px 4px 0 0;background:var(--bg);border:1px solid var(--line)}
.tag.you{background:var(--acc);color:#222;border-color:var(--acc)}
.tag.cd{color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
footer{font-size:11px;color:var(--mut);text-align:center;padding:10px 16px 30px}
</style>
</head>

<footer>Toque no nome do esporte para filtrar e na ★ para favoritar. Horários "em sequência" seguem a ordem dos jogos anteriores. Confira sempre os boletins oficiais.</footer>

const SPORTS=[...new Set(G.map(g=>g.s))];

function load(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let fav=new Set(load("jis_fav",[...YOU]));
let sel=new Set(load("jis_sel",[]));
let day=load("jis_day","all");
const onlyFav=document.getElementById("onlyFav"), showCond=document.getElementById("showCond");
onlyFav.checked=load("jis_of",false); showCond.checked=load("jis_sc",true);

function persist(){save("jis_fav",[...fav]);save("jis_sel",[...sel]);save("jis_day",day);save("jis_of",onlyFav.checked);save("jis_sc",showCond.checked)}

function renderDays(){
  const el=document.getElementById("days");el.innerHTML="";
  [["all","Todos"],["13","Sexta-feira"],["14","Sábado"],["15","Domingo"]].forEach(([k,l])=>{
    const b=document.createElement("button");b.textContent=l;if(String(day)===k)b.className="on";
    b.onclick=()=>{day=k;persist();renderAll()};el.appendChild(b);
  });
}
function renderChips(){
  const el=document.getElementById("chips");el.innerHTML="";
  SPORTS.forEach(s=>{
    const c=document.createElement("div");c.className="chip"+(sel.has(s)?" sel":"");
    const n=document.createElement("button");n.className="n";n.textContent=s;
    n.onclick=()=>{sel.has(s)?sel.delete(s):sel.add(s);persist();renderAll()};
    const st=document.createElement("button");st.className="st"+(fav.has(s)?" f":"");st.textContent=fav.has(s)?"★":"☆";
    st.setAttribute("aria-label","Favoritar "+s);
    st.onclick=()=>{toggleFav(s)};
    c.append(n,st);el.appendChild(c);
  });
  document.getElementById("spSum").textContent="Esportes "+(sel.size?`(${sel.size} selecionado${sel.size>1?"s":""})`:"(todos)")+" · ★ "+fav.size;
}
function toggleFav(s){fav.has(s)?fav.delete(s):fav.add(s);persist();renderAll()}

function mins(t){if(t==="seq")return null;const[h,m]=t.split(":").map(Number);return h*60+m}
function sortKey(g){const m=mins(g.t);return g.d*10000+(m===null?1439:m)}
function esc(x){return x.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function team(x){const e=esc(x);return /CCT/.test(x)?`<span class="c">${e}</span>`:e}

function renderList(){
  const now=new Date();
  const nowDay=(now.getFullYear()===2026&&now.getMonth()===10)?now.getDate():null;
  const nowMin=now.getHours()*60+now.getMinutes();
  let list=G.filter(g=>(day==="all"||String(g.d)===String(day))
    &&(!sel.size||sel.has(g.s))
    &&(!onlyFav.checked||fav.has(g.s))
    &&(showCond.checked||!g.c));
  list.sort((a,b)=>sortKey(a)-sortKey(b));
  const el=document.getElementById("list");el.innerHTML="";
  if(!list.length){el.innerHTML=`<div class="empty">Nenhum jogo com esses filtros.${onlyFav.checked&&!fav.size?"<br>Toque na ☆ de um esporte para favoritá-lo.":""}</div>`;return}
  const isPast=g=>{if(nowDay===null)return false;const m=mins(g.t);if(g.d<nowDay)return true;if(g.d>nowDay||m===null)return false;return m+40<nowMin};
  let nextMarked=false,cur=null;
  list.forEach(g=>{
    if(g.d!==cur){cur=g.d;const h=document.createElement("h2");h.className="day";h.textContent=DAYS[g.d];el.appendChild(h)}
    const past=isPast(g);let next=false;
    if(!past&&!nextMarked&&nowDay!==null&&g.d>=nowDay&&mins(g.t)!==null){next=true;nextMarked=true}
    const d=document.createElement("div");d.className="g"+(past?" past":"")+(next?" next":"")+(g.c?" cond":"");
    const vs=g.b?`${team(g.a)} <span style="color:var(--mut)">x</span> ${team(g.b)}`:team(g.a);
    d.innerHTML=`<div class="tm"><b>${g.t==="seq"?"seq.":g.t}</b><small>${g.t==="seq"?"em sequência":({13:"Sexta",14:"Sábado",15:"Domingo"})[g.d]}</small></div>
    <div class="bd"><div class="top"><span class="sport">${esc(g.s)}</span><button class="fstar${fav.has(g.s)?" f":""}" aria-label="Favoritar">${fav.has(g.s)?"★":"☆"}</button></div>
    <div class="vs">${vs}</div>
    <div class="meta">📍 ${esc(g.l)}<br>${esc(g.f)}${g.n?"<br>"+esc(g.n):""}</div>
    ${next?'<span class="tag" style="background:var(--acc);color:#222;border-color:var(--acc)">Próximo</span>':""}${YOU.has(g.s)?'<span class="tag you">Você joga</span>':""}${g.c?'<span class="tag cd">Se o CCT avançar</span>':""}</div>`;
    d.querySelector(".fstar").onclick=()=>toggleFav(g.s);
    el.appendChild(d);
  });
}
function renderAll(){renderDays();renderChips();renderList()}
document.getElementById("all").onclick=()=>{sel.clear();persist();renderAll()};
document.getElementById("none").onclick=()=>{sel=new Set(fav);persist();renderAll()};
onlyFav.onchange=()=>{persist();renderList()};
showCond.onchange=()=>{persist();renderList()};
renderAll();
setInterval(renderList,60000);
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
