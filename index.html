<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f3f8f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>JISUDESC 2026 · Jogos</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1a2233;--mut:#6b7488;--pri:#1f3f8f;--acc:#f5b400;--hl:#e8efff;--line:#e3e7f0}
@media (prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#192030;--ink:#e8ecf5;--mut:#98a2b8;--pri:#7fa2ff;--hl:#23305a;--line:#2a3348}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#1f3f8f;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 10px}
header h1{margin:0;font-size:20px}
header p{margin:3px 0 0;font-size:12px;opacity:.85}
.ctr{display:flex;align-items:center;gap:8px;margin-top:10px}
.ctr label{font-size:13px;opacity:.9}
.ctr select{flex:1;font-size:16px;font-weight:700;padding:8px 10px;border-radius:10px;border:0;background:#fff;color:#1f3f8f}
.tabs{display:flex;background:#1f3f8f;padding:0 8px}
.tabs button{flex:1;border:0;background:none;color:#fff;opacity:.7;font-size:14px;font-weight:700;padding:10px 0;border-bottom:3px solid transparent}
.tabs button.on{opacity:1;border-bottom-color:var(--acc)}
.hide{display:none!important}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 6px;border-bottom:1px solid var(--line)}
.seg{display:flex;gap:6px;overflow-x:auto}
.seg button{flex:1 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 12px;font-size:14px;font-weight:600}
.seg button.on{background:#1f3f8f;color:#fff;border-color:#1f3f8f}
.tog{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.tog label{display:flex;align-items:center;gap:6px;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 10px}
.wrap{padding:12px 12px calc(30px + env(safe-area-inset-bottom))}
details.sp{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px}
details.sp summary{padding:12px 14px;font-weight:600;font-size:15px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px}
.chip{display:flex;align-items:center;border:1px solid var(--line);border-radius:18px;background:var(--bg);overflow:hidden}
.chip .n{padding:7px 4px 7px 10px;background:none;border:0;color:var(--ink);font-size:13px}
.chip.sel{border-color:var(--pri);background:var(--hl)}
.chip.sel .n{font-weight:700}
.chip .st{border:0;background:none;padding:7px 9px 7px 4px;font-size:15px;color:var(--mut)}
.f{color:var(--acc)!important}
.mini{display:flex;gap:8px;padding:0 12px 12px}
.mini button{font-size:12px;border:1px solid var(--line);background:none;color:var(--pri);border-radius:14px;padding:5px 10px}
h2.day{font-size:16px;margin:18px 4px 8px;color:var(--pri)}
.g{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;display:flex;gap:12px}
.g.past{opacity:.55}
.g.next{border:2px solid var(--acc)}
.g.cond{border-style:dashed}
.tm{min-width:58px;text-align:center}
.tm b{display:block;font-size:19px}
.tm small{font-size:11px;color:var(--mut)}
.bd{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.sport{font-weight:700;font-size:14px}
.bell{text-decoration:none;font-size:18px;line-height:1;padding:0 4px;filter:grayscale(.2)}
.acts{display:flex;align-items:center;gap:2px}
.remb{display:block;width:100%;margin-top:8px;border:0;border-radius:12px;padding:10px;font-size:14px;font-weight:700;background:#f5b400;color:#1a1a1a}
.fstar{border:0;background:none;font-size:20px;line-height:1;color:var(--mut);padding:0 2px}
.vs{margin:6px 0;font-size:15px;overflow-wrap:anywhere}
.c{background:var(--hl);color:var(--pri);font-weight:800;padding:1px 6px;border-radius:6px}
.res{display:inline-block;margin:0 4px;font-weight:800;background:#1f3f8f;color:#fff;border-radius:6px;padding:1px 7px;font-size:14px}
.meta{font-size:12px;color:var(--mut);line-height:1.5}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;margin:4px 4px 0 0;background:var(--bg);border:1px solid var(--line);color:var(--mut)}
.tag.nx{background:var(--acc);color:#222;border-color:var(--acc)}
.empty{text-align:center;color:var(--mut);padding:30px 10px;font-size:14px}
.tbl,.rg{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.tbl h3,.rg h3{margin:0;padding:10px 12px 2px;font-size:15px}
.tbl .sub{padding:0 12px 8px;font-size:12px;color:var(--mut)}
.tbl table{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;color:var(--mut);font-weight:600;padding:6px 3px;border-top:1px solid var(--line)}
.tbl td{padding:8px 3px;border-top:1px solid var(--line);text-align:center}
.tbl td.t,.tbl th.t{text-align:left;padding-left:10px;overflow-wrap:anywhere}
.tbl tr.me td{background:var(--hl);font-weight:800;color:var(--pri)}
.tbl tr.q td:first-child{box-shadow:inset 3px 0 0 #2e9d5b}
.gl{font-size:12px;color:var(--mut);padding:6px 12px 10px;border-top:1px solid var(--line);line-height:1.7}
.gl b{color:var(--ink)}
.rg .bx{padding:4px 12px 12px;font-size:13px;line-height:1.55}
.rg ul{margin:4px 0;padding-left:18px}
.btn{display:block;text-align:center;background:#1f3f8f;color:#fff;text-decoration:none;font-weight:700;padding:12px;border-radius:12px;margin-bottom:12px}
.ov{position:fixed;inset:0;background:rgba(10,15,30,.6);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
.ov .box{background:var(--card);border-radius:18px;padding:18px;max-width:420px;width:100%}
.ov h3{margin:0 0 4px}
.ov p{margin:0 0 12px;font-size:13px;color:var(--mut)}
.ov .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ov .grid button{padding:12px 4px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700;font-size:14px}
.ov .grid button.all{grid-column:1/-1}
</style>
</head>
<body>
<header>
  <h1>JISUDESC 2026</h1>
  <p>Horários, resultados e classificação · <span id="upd"></span></p>
  <div class="ctr"><label for="center">Meu centro</label><select id="center"></select></div>
</header>
<nav class="tabs"><button id="tabJ" class="on">Jogos</button><button id="tabC">Classificação</button><button id="tabR">Regulamento</button></nav>

<div class="bar" id="barJ">
  <div class="seg" id="days"></div>
  <div class="tog">
    <label><input type="checkbox" id="onlyFav"> Só favoritos ★</label>
    <label><input type="checkbox" id="showCond" checked> Fases finais</label>
  </div>
  <button class="remb hide" id="remb">🔔 Lembretes dos favoritos na agenda (30 min antes)</button>
</div>

<div class="wrap" id="viewJ">
  <details class="sp" id="spBox">
    <summary id="spSum">Esportes</summary>
    <div class="mini" style="font-size:12px;color:var(--mut)">Toque num esporte para marcar ou desmarcar como favorito.</div>
    <div class="chips" id="chips"></div>
  </details>
  <div id="list"></div>
</div>
<div class="wrap hide" id="viewC"></div>
<div class="wrap hide" id="viewR"></div>

<div class="ov hide" id="ov"><div class="box"><h3>Qual é o seu centro?</h3><p>Os jogos dele ficam em destaque. Dá para trocar depois, lá em cima.</p><div class="grid" id="ovg"></div></div></div>

<script src="data.js"></script>
<script>
const DAYS={13:"Sexta-feira",14:"Sábado",15:"Domingo"};
const SHORT={13:"Sexta",14:"Sábado",15:"Domingo"};
const ALIAS={REIT:"REITORIA",CE0:"CEO",CERESI:"CERES"};
function esc(x){return String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function centersIn(str){const out=new Set();(String(str).toUpperCase().match(/[A-Z0-9]{2,}/g)||[]).forEach(w=>{w=w.replace(/\d+$/,"");w=ALIAS[w]||w;if(CENTROS.includes(w))out.add(w)});return out}
function mins(t){if(!/^\d/.test(t))return null;const[h,m]=t.split(":").map(Number);return h*60+m}

// Monta a lista de jogos
const G=[];
const last={};
RAW.forEach(r=>{const[s,d,t,a,b,l,f,c,n,res,det]=r;const k=s+d;let o=mins(t);
  if(o===null){o=(last[k]||0)+1}last[k]=o;
  G.push({s,d,t,a,b,l,f,c:!!c,n:n||"",r:res||"",det:det||"",o,cs:new Set([...centersIn(a),...centersIn(b)])})});
IND.forEach(r=>{const[s,d,t,a,l,f,who]=r;
  G.push({s,d,t,a,b:"",l,f,c:false,n:"",r:"",o:mins(t),ind:who,cs:new Set(who==="ALL"||!who?[]:Object.keys(who)),all:who==="ALL"||!who})});
// Centros que disputam cada esporte (para mostrar fases finais)
const SPC={};G.forEach(g=>{if(!g.c){SPC[g.s]=SPC[g.s]||new Set();g.cs.forEach(x=>SPC[g.s].add(x))}});
const SPORTS=[...new Set(G.map(g=>g.s))];

function load(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let center=load("jis_center",null);
const hc=decodeURIComponent(location.hash.slice(1)).toUpperCase();
if(CENTROS.includes(hc)||hc==="TODOS"){center=hc==="TODOS"?"ALL":hc;save("jis_center",center)}
let fav=new Set(load("jis_fav2",[])),sel=new Set(load("jis_sel2",[])),day=load("jis_day","all"),tab=load("jis_tab","J");
const onlyFav=document.getElementById("onlyFav"),showCond=document.getElementById("showCond");
onlyFav.checked=load("jis_of",false);showCond.checked=load("jis_sc",true);
function persist(){save("jis_fav2",[...fav]);save("jis_sel2",[...sel]);save("jis_day",day);save("jis_of",onlyFav.checked);save("jis_sc",showCond.checked)}

// Seletor de centro
const csel=document.getElementById("center");
csel.innerHTML='<option value="ALL">Todos os centros</option>'+CENTROS.map(c=>`<option value="${c}">${c}</option>`).join("");
function setCenter(c){center=c;save("jis_center",c);csel.value=c;document.getElementById("ov").classList.add("hide");sel.clear();persist();renderAll()}
csel.onchange=()=>setCenter(csel.value);
document.getElementById("ovg").innerHTML=CENTROS.map(c=>`<button data-c="${c}">${c}</button>`).join("")+'<button class="all" data-c="ALL">Ver todos os centros</button>';
document.querySelectorAll("#ovg button").forEach(b=>b.onclick=()=>setCenter(b.dataset.c));

function involved(g){if(center==="ALL")return true;if(g.all)return true;if(g.cs.has(center))return true;
  if(g.c&&g.cs.size===0&&SPC[g.s]&&SPC[g.s].has(center))return true;return false}
function hl(x){if(center==="ALL")return esc(x);
  return esc(x).split(/(\s+x\s+|\s+ou\s+|\(|\))/).map(p=>centersIn(p).has(center)&&!/^\s*(x|ou)\s*$/.test(p)?`<span class="c">${p}</span>`:p).join("")}
function toggleFav(s){fav.has(s)?fav.delete(s):fav.add(s);persist();renderAll()}

function renderDays(){const el=document.getElementById("days");el.innerHTML="";
  [["all","Todos"],["13","Sexta-feira"],["14","Sábado"],["15","Domingo"]].forEach(([k,l])=>{const b=document.createElement("button");b.textContent=l;if(String(day)===k)b.className="on";b.onclick=()=>{day=k;persist();renderAll()};el.appendChild(b)})}
function mySports(){return SPORTS.filter(s=>G.some(g=>g.s===s&&!g.c&&involved(g)))}
function renderChips(){const el=document.getElementById("chips");el.innerHTML="";
  mySports().forEach(s=>{const c=document.createElement("div");c.className="chip"+(fav.has(s)?" sel":"");
    const n=document.createElement("button");n.className="n";n.textContent=s;n.onclick=()=>toggleFav(s);
    const st=document.createElement("button");st.className="st"+(fav.has(s)?" f":"");st.textContent=fav.has(s)?"★":"☆";st.onclick=()=>toggleFav(s);
    c.append(n,st);el.appendChild(c)});
  document.getElementById("spSum").textContent="★ Escolher favoritos ("+fav.size+")"}

function renderList(){
  const now=new Date(),nowDay=(now.getFullYear()===2026&&now.getMonth()===10)?now.getDate():null,nowMin=now.getHours()*60+now.getMinutes();
  let list=G.filter(g=>involved(g)&&(day==="all"||String(g.d)===String(day))&&(!onlyFav.checked||fav.has(g.s))&&(showCond.checked||!g.c));
  list.sort((a,b)=>a.d-b.d||a.o-b.o);
  const el=document.getElementById("list");el.innerHTML="";
  if(!list.length){el.innerHTML=`<div class="empty">Nenhum jogo com esses filtros.${onlyFav.checked&&!fav.size?"<br>Toque na ☆ de um esporte para favoritá-lo.":""}</div>`;return}
  const isPast=g=>{if(nowDay===null)return false;if(g.d!==nowDay)return g.d<nowDay;const m=mins(g.t);return m!==null&&m<=nowMin};
  let marked=false,cur=null;
  list.forEach(g=>{
    if(g.d!==cur){cur=g.d;const h=document.createElement("h2");h.className="day";h.textContent=DAYS[g.d];el.appendChild(h)}
    const past=g.r?true:isPast(g);let next=false;
    if(!past&&!marked&&nowDay!==null&&g.d>=nowDay&&mins(g.t)!==null){next=true;marked=true}
    let who="";
    if(g.ind&&g.ind!=="ALL"){if(center==="ALL"){const n=Object.values(g.ind).reduce((a,v)=>a+v.split(";").length,0);who=`${n} inscritos`}
      else if(g.ind[center])who=`${center}: `+g.ind[center].split(";").map(x=>x.trim()).join(", ")}
    if(g.all)who="Todos os centros";
    const vs=g.b?(g.r?`${hl(g.a)} <span class="res">${esc(g.r)}</span> ${hl(g.b)}`:`${hl(g.a)} <span style="color:var(--mut)">x</span> ${hl(g.b)}`):hl(g.a)+(g.r?` <span class="res">${esc(g.r)}</span>`:"");
    const d=document.createElement("div");d.className="g"+(past&&!g.r?" past":"")+(next?" next":"")+(g.c?" cond":"");
    d.innerHTML=`<div class="tm"><b>${g.t==="seq"?"seq.":esc(g.t)}</b><small>${g.t==="seq"?"em sequência":SHORT[g.d]}</small></div>
    <div class="bd"><div class="top"><span class="sport">${esc(g.s)}</span><span class="acts">${mins(g.t)!==null&&!g.r?`<a class="bell" href="${gcal(g)}" target="_blank" rel="noopener" aria-label="Adicionar à agenda">🔔</a>`:""}<button class="fstar${fav.has(g.s)?" f":""}" aria-label="Favoritar">${fav.has(g.s)?"★":"☆"}</button></span></div>
    <div class="vs">${vs}</div>${g.det?`<div class="meta">Sets: ${esc(g.det)}</div>`:""}
    <div class="meta">📍 ${esc(g.l)}<br>${esc(g.f)}${g.n?"<br>"+esc(g.n):""}${who?"<br>"+esc(who):""}</div>
    ${next?'<span class="tag nx">Próximo</span>':""}${g.c?'<span class="tag">Depende da classificação</span>':""}${g.r?'<span class="tag">Encerrado</span>':""}</div>`;
    d.querySelector(".fstar").onclick=()=>toggleFav(g.s);el.appendChild(d)})}

// ===== LEMBRETES (agenda) =====
function utc(d,t,add){const m=mins(t)+(add||0)+180;const dd=d+Math.floor(m/1440),mm=m%1440;const p=n=>String(n).padStart(2,"0");return `202611${p(dd)}T${p(Math.floor(mm/60))}${p(mm%60)}00Z`}
function evTitle(g){return `${g.s}: ${g.b?g.a+" x "+g.b:g.a}`}
function evDesc(g){return `JISUDESC 2026 · ${g.f}${g.n?" · "+g.n:""}${g.c?" · Depende da classificação":""}`}
function gcal(g){return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(evTitle(g))+"&dates="+utc(g.d,g.t)+"/"+utc(g.d,g.t,40)+"&details="+encodeURIComponent(evDesc(g)+" · Lembrete 30 min antes")+"&location="+encodeURIComponent(g.l+" – AFFESC, Florianópolis")}
function icsEsc(x){return String(x).replace(/[\\,;]/g,m=>"\\"+m).replace(/\n/g,"\\n")}
function makeIcs(){
  const list=G.filter(g=>fav.has(g.s)&&involved(g)&&mins(g.t)!==null&&!g.r).sort((a,b)=>a.d-b.d||a.o-b.o);
  if(!list.length)return null;
  const now=utc(13,"00:00");
  let out=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//JISUDESC 2026//Jogos//PT","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  list.forEach((g,i)=>{out.push("BEGIN:VEVENT","UID:jis26-"+g.d+"-"+g.t.replace(":","")+"-"+i+"-"+evTitle(g).replace(/[^A-Za-z0-9]/g,"")+"@jisudesc","DTSTAMP:"+now,"DTSTART:"+utc(g.d,g.t),"DTEND:"+utc(g.d,g.t,40),
    "SUMMARY:"+icsEsc(evTitle(g)),"LOCATION:"+icsEsc(g.l+" – AFFESC, Florianópolis"),"DESCRIPTION:"+icsEsc(evDesc(g)),
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(evTitle(g)),"TRIGGER:-PT30M","END:VALARM","END:VEVENT")});
  out.push("END:VCALENDAR");return {txt:out.join("\r\n"),n:list.length}}
document.getElementById("remb").onclick=()=>{const r=makeIcs();if(!r)return;
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([r.txt],{type:"text/calendar"}));a.download="jisudesc-favoritos.ics";document.body.appendChild(a);a.click();a.remove();
  document.getElementById("remb").textContent=`✅ ${r.n} jogos baixados – abra o arquivo para adicionar à agenda`};

// ===== CLASSIFICAÇÃO (critérios do Regulamento Técnico) =====
// Vôlei 4x4 e Basquete 3x3: vitória 2, derrota 1. Futebol suíço: vitória 3, empate 1, derrota 0.
function setPts(det){let p=0,c=0;(det||"").split(/[\s,;]+/).forEach(x=>{const m=x.match(/^(\d+)-(\d+)$/);if(m){p+=+m[1];c+=+m[2]}});return[p,c]}
function avg(a,b){return b===0?(a>0?Infinity:0):a/b}
function parseR(x){const m=String(x).match(/(\d+)\s*[x×-]\s*(\d+)/);return m?[+m[1],+m[2]]:null}
function fromGames(sp,a,b){for(const g of G){if(g.s!==sp||!g.r)continue;
  if(g.a===a&&g.b===b){const r=parseR(g.r);if(r)return[r,g.det]}
  if(g.a===b&&g.b===a){const r=parseR(g.r);if(r)return[[r[1],r[0]],g.det.split(/[\s,;]+/).map(x=>x.split("-").reverse().join("-")).join(" ")]}}return[null,""]}
function table(g,tipo,sp){
  const T={};g.times.forEach(t=>T[t]={t,J:0,V:0,E:0,D:0,P:0,C:0,SP:0,SC:0,Pts:0});
  const played=[];
  g.jogos.forEach(([a,b,r,det])=>{if(!r){[r,det]=fromGames(sp,a,b)}if(!r||!T[a]||!T[b])return;const[x,y]=r,A=T[a],B=T[b];played.push([a,b,x,y]);
    A.J++;B.J++;
    if(tipo==="sets"){A.SP+=x;A.SC+=y;B.SP+=y;B.SC+=x;const[p,c]=setPts(det);A.P+=p;A.C+=c;B.P+=c;B.C+=p}
    else{A.P+=x;A.C+=y;B.P+=y;B.C+=x}
    if(x>y){A.V++;B.D++}else if(y>x){B.V++;A.D++}else{A.E++;B.E++}});
  const L=Object.values(T);
  L.forEach(o=>o.Pts=tipo==="gols"?o.V*3+o.E:o.V*2+o.D);
  const h2h=(a,b)=>{for(const[x,y,s1,s2]of played){if(x===a.t&&y===b.t)return s2-s1;if(x===b.t&&y===a.t)return s1-s2}return 0};
  const multi=(a,b)=>{
    if(tipo==="sets")return avg(b.SP,b.SC)-avg(a.SP,a.SC)||avg(b.P,b.C)-avg(a.P,a.C)||a.t.localeCompare(b.t);
    if(tipo==="gols")return b.V-a.V||(b.P-b.C)-(a.P-a.C)||b.P-a.P||a.t.localeCompare(b.t);
    return (b.P-b.C)-(a.P-a.C)||b.P-a.P||a.t.localeCompare(b.t)};
  L.sort((a,b)=>b.Pts-a.Pts||multi(a,b));
  // Empate entre exatamente 2 equipes: confronto direto primeiro
  for(let i=0;i<L.length-1;i++){const same=L.filter(o=>o.Pts===L[i].Pts);
    if(same.length===2&&L[i+1].Pts===L[i].Pts){const r=h2h(L[i],L[i+1]);if(r>0){[L[i],L[i+1]]=[L[i+1],L[i]]}else if(r===0&&tipo==="gols"){}i++}}
  return L;
}
function renderStd(){
  const el=document.getElementById("viewC");
  const of=load("jis_ofc",false);
  let h=`<div class="tog" style="margin:0 0 12px"><label><input type="checkbox" id="ofc" ${of?"checked":""}> Só favoritos ★</label></div>`;
  const isMine=t=>center!=="ALL"&&centersIn(t).has(center);
  let list=STD;
  if(center!=="ALL"){const mine=STD.filter(m=>m.grupos.some(g=>g.times.some(isMine)));const rest=STD.filter(m=>!mine.includes(m));list=[...mine,...rest]}
  if(of)list=list.filter(m=>fav.has(m.s));
  if(of&&!list.length)h+=`<div class="empty">Nenhum esporte coletivo nos favoritos.<br>Toque na ☆ ao lado do nome de uma tabela para favoritá-la.</div>`;
  list.forEach(m=>m.grupos.forEach(g=>{
    const L=table(g,m.tipo,m.s),gol=m.tipo==="gols";
    const pp=m.tipo==="sets"?"Sets":gol?"Gols":"Pontos";
    h+=`<div class="tbl"><h3 class="top" style="padding-right:10px"><span>${esc(m.s)} · ${esc(g.n)}</span><button class="fstar${fav.has(m.s)?" f":""}" data-s="${esc(m.s)}" aria-label="Favoritar">${fav.has(m.s)?"★":"☆"}</button></h3><div class="sub">${esc(g.cls)}</div><table>
    <tr><th>#</th><th class="t">Equipe</th><th>Pts</th><th>J</th><th>V</th>${gol?"<th>E</th>":""}<th>D</th><th>${pp}</th><th>Saldo</th></tr>`;
    L.forEach((o,i)=>{const a=m.tipo==="sets"?o.SP:o.P,b=m.tipo==="sets"?o.SC:o.C,sd=a-b;
      h+=`<tr class="${isMine(o.t)?"me":""} ${i<g.q&&o.J?"q":""}"><td>${i+1}</td><td class="t">${esc(o.t)}</td><td><b>${o.Pts}</b></td><td>${o.J}</td><td>${o.V}</td>${gol?`<td>${o.E}</td>`:""}<td>${o.D}</td><td>${a}:${b}</td><td>${sd>0?"+":""}${sd}</td></tr>`});
    h+=`</table><div class="gl">`+g.jogos.map(([a,b,r,det])=>{if(!r){[r,det]=fromGames(m.s,a,b)}return `${hl(a)} ${r?`<b>${r[0]} x ${r[1]}</b>`:"x"} ${hl(b)}${det?` <span>(${esc(det)})</span>`:""}`}).join("<br>")+(g.pend?`<br><i>${esc(g.pend)}</i>`:"")+`</div></div>`}));
  h+=`<div class="empty" style="padding:10px">Pontuação e desempates conforme o Regulamento Técnico (aba Regulamento). Atualizado até o ${esc(BOLETIM)}. Em caso de diferença, vale a classificação oficial da organização.</div>`;
  el.innerHTML=h;
  document.getElementById("ofc").onchange=e=>{save("jis_ofc",e.target.checked);renderStd()};
  el.querySelectorAll(".fstar").forEach(b=>b.onclick=()=>toggleFav(b.dataset.s))}

function setTab(t){tab=t;save("jis_tab",t);
  ["J","C","R"].forEach(k=>{document.getElementById("tab"+k).className=k===t?"on":"";document.getElementById("view"+k).classList.toggle("hide",k!==t)});

["J","C","R"].forEach(k=>document.getElementById("tab"+k).onclick=()=>setTab(k));

// ===== RESULTADOS AO VIVO (planilha oficial do chaveamento) =====
const SHEET_ID="1ZKNnBW2bFo7ZUFw4_LpUEcmrlPmJ8FsPdWsER8a18cI";
const TABS={"Basquete 3x3":"Basquete 3x3 Masculino","fut7":"Futebol Suíço Masculino",
 "volei 4x MASC":"Vôlei 4x4 Masculino","volei 4x FEM":"Vôlei 4x4 Feminino","volei 4x MISTO":"Vôlei 4x4 Misto",
 "Beach Tennis Masculino":"Beach Tennis Masculino","Beach Tennis Feminino":"Beach Tennis Feminino","Beach Tennis Misto":"Beach Tennis Misto",
 "Bocha Masculina":"Bocha Masculino","Bocha Feminina":"Bocha Feminino","Canastra":"Canastra","Domino":"Dominó","FIFA":"FIFA",
 "Sinuca Masculino":"Sinuca Masculino","Sinuca Feminino":"Sinuca Feminino","Tênis de Campo Masculino":"Tênis de Campo Masculino",
 "Tênis de Campo Feminino":"Tênis de Campo Feminino","Tênis de mesa Masculino":"Tênis de Mesa Masculino","Tenis de Mesa Feminino":"Tênis de Mesa Feminino",
 "TOTO Masculino":"Totó Masculino","TOTO Feminino":"Totó Feminino","TRUCO":"Truco"};
const BASE=G.map(g=>({d:g.d,t:g.t,o:g.o,a:g.a,b:g.b,c:g.c,r:g.r,det:g.det}));
function csvParse(t){const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch=='"')q=true;else if(ch==","){row.push(f);f=""}else if(ch=="\n"){row.push(f);rows.push(row);row=[];f=""}else if(ch!="\r")f+=ch}
  if(f||row.length){row.push(f);rows.push(row)}return rows}
function nrm(x){return String(x||"").toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s*\/\s*/g,"/").replace(/\s+/g," ").trim().replace(/\bREIT(?![A-Z])/g,"REITORIA").replace(/CE0/g,"CEO")}
const isN=c=>/^\d+$/.test(c);
function rowsToGames(rows){const out=[];
  rows.forEach(row=>{row=row.map(c=>String(c||"").trim());
    row.forEach((c,ix)=>{if(c.toUpperCase()!=="X")return;
      let j=ix-1,L=[];while(j>=0&&(row[j]===""||isN(row[j])||/^W\.?O\.?$/i.test(row[j]))){if(row[j]!=="")L.unshift(row[j]);j--}
      let k=ix+1,R=[];while(k<row.length&&(row[k]===""||isN(row[k])||/^W\.?O\.?$/i.test(row[k]))){if(row[k]!=="")R.push(row[k]);k++}
      const t1=row[j]||"",t2=row[k]||"";if(!t1||!t2)return;
      let d=null,t=null;for(let m=0;m<j;m++){if(/^\d{1,2}\/11$/.test(row[m]))d=+row[m].split("/")[0];if(/^\d{1,2}:\d{2}$/.test(row[m]))t=row[m].padStart(5,"0")}
      let r="",det="";
      const wo=[...L,...R].some(x=>/W/i.test(x));
      if(wo){r=L.some(x=>/W/i.test(x))?"W.O. x vitória":"vitória x W.O."}
      else if(L.length===1&&R.length===1)r=`${L[0]} x ${R[0]}`;
      else if(L.length>1&&L.length===R.length){let a=0,b=0;const p=[];L.forEach((x,i)=>{p.push(x+"-"+R[i]);+x>+R[i]?a++:b++});r=`${a} x ${b}`;det=p.join(" ")}
      out.push({t1,t2,r,det,d,t})})});
  return out}
const realTeam=x=>centersIn(x).size>0&&!/^(VJ|PJ|[VP]\d|\d|MELHOR|PERDEDOR|VENCEDOR)/i.test(x.trim());
function applyLive(tabs){
  G.forEach((g,i)=>Object.assign(g,BASE[i]));
  let used=0;
  for(const[tab,csv]of Object.entries(tabs)){const sp=TABS[tab];if(!sp||!csv)continue;
    const games=rowsToGames(csvParse(csv)),mine=G.filter(g=>g.s===sp);const done=new Set();let hits=0;
    games.forEach(x=>{const A=nrm(x.t1),B=nrm(x.t2);
      let g=mine.find(g=>!done.has(g)&&nrm(g.a)===A&&nrm(g.b)===B),rev=false;
      if(!g){g=mine.find(g=>!done.has(g)&&nrm(g.a)===B&&nrm(g.b)===A);rev=!!g}
      if(!g)return;hits++;done.add(g);x.done=true;
      if(x.r){if(rev){const p=x.r.split(" x ");g.r=p[1]+" x "+p[0];g.det=x.det.split(" ").map(s=>s.split("-").reverse().join("-")).join(" ")}else{g.r=x.r;g.det=x.det}}
      if(x.d&&x.t&&(x.d!==g.d||x.t!==g.t)){g.d=x.d;g.t=x.t;g.o=mins(x.t)}});
    if(!hits)continue;used++;
    // jogos de fase seguinte: casa por dia e horário quando a planilha já tem os nomes das equipes
    games.forEach(x=>{if(x.done||!x.d||!x.t)return;
      const c=mine.filter(g=>!done.has(g)&&g.d===x.d&&g.t===x.t);if(!c.length||(c.length>1&&!c.every(g=>g.c)))return;const g=c[0];
      if(realTeam(x.t1)&&realTeam(x.t2)){g.a=x.t1;g.b=x.t2;g.c=false;g.cs=new Set([...centersIn(x.t1),...centersIn(x.t2)])}else return;
      done.add(g);if(x.r){g.r=x.r;g.det=x.det}})}
  return used}
let liveInfo=load("jis_live",null);
function setUpd(){const u=document.getElementById("upd");
  if(liveInfo&&liveInfo.used){const dt=new Date(liveInfo.ts);u.textContent=`Resultados da planilha oficial · ${String(dt.getHours()).padStart(2,"0")}:${String(dt.getMinutes()).padStart(2,"0")}`}
  else u.textContent=BOLETIM}
if(liveInfo&&liveInfo.tabs){liveInfo.used=applyLive(liveInfo.tabs)}
async function fetchLive(){
  const names=Object.keys(TABS),tabs={};
  await Promise.all(names.map(async n=>{try{
    const r=await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=0&sheet=${encodeURIComponent(n)}&_=${Date.now()}`,{cache:"no-store"});
    if(r.ok){const t=await r.text();if(!/^\s*<|google\.visualization/.test(t))tabs[n]=t}}catch(e){}}));
  if(!Object.keys(tabs).length)return;
  const used=applyLive(tabs);if(!used)return;
  liveInfo={ts:Date.now(),used,tabs};save("jis_live",liveInfo);setUpd();renderAll()}

setUpd();
if(center===null){document.getElementById("ov").classList.remove("hide");center="ALL"}else csel.value=center;
renderReg();renderAll();setTab(tab);
setInterval(renderList,60000);
fetchLive();setInterval(fetchLive,5*60*1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)fetchLive()});
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
